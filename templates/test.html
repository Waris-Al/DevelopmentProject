<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Search</title>
    <script>

        function genreGetter() {
            let albumName = "chromakopia";//document.getElementById("albumName").innerText;
            let artistName = "tyler, the creator"; //document.getElementById("artistName").innerText;
    
            let encodedAlbum = encodeURIComponent(albumName);
            let encodedArtist = encodeURIComponent(artistName);
    
            fetch(`https://musicbrainz.org/ws/2/release-group/?query=release:${encodedAlbum}%20AND%20artist:${encodedArtist}&fmt=json`)
                .then(response => response.json())
                .then(data => {
                    let tagsSet = new Set(); // Use a Set to store unique tags
            
                    data["release-groups"]?.forEach(group => {
                        group.tags?.forEach(tag => {
                            if (tag.count > 0) { 
                                tagsSet.add(tag.name);
                            }
                        });
                    });
            
                    if (tagsSet.size > 0) {
                        console.log("Tags:", [...tagsSet]);
                    } else {
                        console.log("No tags available.");
                    }
                })
                .catch(error => console.error("Error fetching data:", error));
    
            return true;
        
        }




        const clientId = "{{ spotifyClientID }}";
        const clientSecret = "{{ spotifyClientSecret }}";

        async function getAccessToken() {
            const response = await fetch("https://accounts.spotify.com/api/token", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "Authorization": "Basic " + btoa(clientId + ":" + clientSecret)
                },
                body: "grant_type=client_credentials"
            });
            const data = await response.json();
            return data.access_token;
        }

        async function searchSpotify() {
            const query = document.getElementById("search").value;
            if (!query) return;

            const token = await getAccessToken();
            const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=album`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            const data = await response.json();
            displayResults(data);
        }


        async function showTracks() {
            const token = await getAccessToken();
            const response = await fetch(`https://api.spotify.com/v1/albums/5oT7xqbRbQCevZ0XC5aBFu/tracks`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const tracks = await response.json();
            const trackNames = [];

            for (let i=0; i < tracks.items.length; i++)
            {
                trackNames.push(tracks.items[i].name);
            }

            console.log(trackNames);
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";

            if (data.albums) {
                data.albums.items.forEach(album => {
                    const albumElement = document.createElement("div");
                    albumElement.innerHTML = `
                        <p><strong>${album.name}</strong> by ${album.artists.map(artist => artist.name).join(", ")}</p>
                        <button onclick="showDetails('${album.id}')">Show Details</button>
                        <div id="details-${album.id}"></div>
                        <hr>
                    `;
                    resultsDiv.appendChild(albumElement);
                });
            }
        }

        async function showDetails(albumId) {
            const token = await getAccessToken();
            const response = await fetch(`https://api.spotify.com/v1/albums/${albumId}`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            
            const album = await response.json();
            const detailsDiv = document.getElementById(`details-${album.id}`);
            detailsDiv.innerHTML = `
                <img src="${album.images[0].url}" alt="${album.name}" width="200">
                <p>Release Date: ${album.release_date}</p>
            `;
        }
    </script>
</head>
<body>
    <h1>Spotify Search</h1>
    <input type="text" id="search" placeholder="Search for albums...">
    <button onclick="searchSpotify()">Search</button>
    <div id="results"></div>

    <button onclick="genreGetter()">dsfsdfsd</button>
</body>
</html>
