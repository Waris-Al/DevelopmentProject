<!DOCTYPE html>
<link href="../static/css/homepage.css" rel="stylesheet" type="text/css" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include "NavBar.html" %}
<html>
<body>
    <script>
        const userFavourites = {{ favourites | tojson }}; 
        const clientId = "{{ spotifyClientID }}";
        const clientSecret = "{{ spotifyClientSecret }}";


        async function followUser() {
            try {
                const response = await fetch('/followUser', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ followeeEmail: "{{ profilesEmail }}" })
                });

                if (response.ok) {
                    const data = await response.json();
                    alert(data.message || 'Followed successfully!');
                } else {
                    alert('Failed to follow');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while trying to follow');
            }
        }

        document.getElementById('follow-button')?.addEventListener('click', followUser);
    </script>
    <script src="../static/JS/homepage.js" defer></script>
    <div class="Homepage">
        <h1>{{ username }}'s Favourites</h1>

        {% if showChatButton %}
            <button id="chat-button">Chat</button>
        {% elif showFollowButton %}
            <button id="follow-button" onclick='followUser()'>Follow</button>
        {% endif %}
    

        <iframe id="newReview" src="newReview" class="newReview" style="display:none"></iframe>
        <iframe id="editReview" src="editReview" class="editReview" style="display:none"></iframe>
        <div class="topThree">
            <div id="FavouriteAlbum" class="FavouriteAlbum"> 
                <p id="FavouriteAlbumName"></p>
                <img id="FavouriteAlbumImage" src="" alt="FavouriteAlbum" class="FavouriteAlbum">
            </div>

            <div id="FavouriteArtist" class="FavouriteArtist">
                <p id="FavouriteArtistName"></p>
                <img id="FavouriteArtistImage" src="" alt="FavouriteArtist" class="FavouriteArtist">
            </div>

            <div id="FavouriteTrack" class="FavouriteTrack">
                <p id="FavouriteTrackName"></p>
                <img id="FavouriteTrackImage" src="" alt="FavouriteTrack" class="FavouriteTrack">
            </div>
        </div>

        <br><br><br> <!--Replace with actual CSS-->

        <h1>Recent Reviews</h1>
        <table class="RecentReviews">
            <tbody>
                {% for review in reviews %}
                <tr>
                    <td><img src="{{ review.artist_name | replace(' ', '_') }}.jpg" alt="Artist PFP"></td>
                    <td>{{ review.album_name }}</td>
                    <td>{{ review.artist_name }}</td>
                    <td>{{ review.date_listened }}</td>
                    <td>{{ review.review }}</td>
                    <td>
                        <div id="commentFor-{{ review.review_id }}" style="display:none;">
                            <input type="text" id="commentInput-{{review.review_id}}" placeholder="Write a comment...">
                            <button class="commentButton" onclick="addComment({{ review.review_id }})">Comment</button>
                        </div>
                    </td>
                    <td>
                        <button onclick="leaveComment({{ review.review_id }})">Reply</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
