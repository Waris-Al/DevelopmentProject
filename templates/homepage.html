<!DOCTYPE html>
<link href="../static/css/homepage.css" rel="stylesheet" type="text/css" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include "NavBar.html" %}
<html>
<body>
    <script>
        const clientId = "{{ spotifyClientID }}";
        const clientSecret = "{{ spotifyClientSecret }}";
    
        async function getAccessToken() {
            const response = await fetch("https://accounts.spotify.com/api/token", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "Authorization": "Basic " + btoa(clientId + ":" + clientSecret)
                },
                body: "grant_type=client_credentials"
            });
            const data = await response.json();
            return data.access_token;
        }
    
        async function editFavouriteAlbum(query) {
            const token = await getAccessToken();
            const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=album`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const searchInfo = await response.json();
            if (searchInfo.albums.items.length > 0) {
                const album = searchInfo.albums.items[0];
                document.getElementById('FavouriteAlbumName').innerText = album.name;
                document.getElementById('FavouriteAlbumImage').src = album.images[0].url;
            }
        }
    
        async function editFavouriteSong(query) {
            const token = await getAccessToken();
            const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const searchInfo = await response.json();
            if (searchInfo.tracks.items.length > 0) {
                const song = searchInfo.tracks.items[0];
                document.getElementById('FavouriteSongName').innerText = song.name;
                document.getElementById('FavouriteSongImage').src = song.album.images[0].url;
            }
        }
    
        async function editFavouriteArtist(query) {
            const token = await getAccessToken();
            const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=artist`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const searchInfo = await response.json();
            if (searchInfo.artists.items.length > 0) {
                const artist = searchInfo.artists.items[0];
                document.getElementById('FavouriteArtistName').innerText = artist.name;
                document.getElementById('FavouriteArtistImage').src = artist.images[0].url;
            }
        }
    


        /*
        right now we're removing the button entirely, change this so that it just makes it disappear, and then reappear after hitting search
        */
        function replaceWithSearch(id, type) {
            const container = document.getElementById(id); 
    
            if (!container) {
                console.error(`Container with ID '${id}' not found!`);
                return;
            }
    
            const editButton = container.querySelector("button");
            if (editButton) {
                editButton.remove(); 
            }
    
            const searchDiv = document.createElement('div');
            searchDiv.innerHTML = `
                <input type="text" id="${id}Query" placeholder="Search for ${type}" />
                <button onclick="searchAndUpdate('${id}', '${type}')">Search</button>
            `;
            container.appendChild(searchDiv); 
        }
    
        function searchAndUpdate(id, type) {
            const query = document.getElementById(`${id}Query`).value;
            if (!query) return;
    
            if (type === 'album') {
                editFavouriteAlbum(query);
            } else if (type === 'song') {
                editFavouriteSong(query);
            } else if (type === 'artist') {
                editFavouriteArtist(query);
            }
        }
    
        function addReview() {
            document.getElementById("newReview").style.display = "block";
        }
    </script>
    
    
    <div class="Homepage">
        <h1>My Favourites</h1>
        <iframe id="newReview" src="newReview" class="newReview" style="display:none"></iframe>
        <div class="topThree">
            <div id="FavouriteAlbum" class="FavouriteAlbum"> 
                <iframe id="newAlbum" src="newFavourite" class="newAlbum" style="display:none"></iframe>
                <p id="FavouriteAlbumName">GUTS</p>
                <img id="FavouriteAlbumImage" src="https://i.scdn.co/image/ab67616d0000b273e85259a1cae29a8d91f2093d" alt="FavouriteAlbum" class="FavouriteAlbum">
                <button id="FavouriteAlbumEdit" onclick="replaceWithSearch('FavouriteAlbum', 'album')">Edit</button>
            </div>

            <div id="FavouriteArtist" class="FavouriteArtist">
                <p id="FavouriteArtistName">Kendrick Lamar</p>
                <img id="FavouriteArtistImage" src="../static/Images/WFA.jpg" alt="FavouriteArtist" class="FavouriteArtist">
                <button id="FavouriteArtistEdit" onclick="replaceWithSearch('FavouriteArtist', 'artist')">Edit</button>
            </div>

            <div id="FavouriteSong" class="FavouriteSong">
                <p id="FavouriteSongName">Dreams and Nightmares</p>
                <img id="FavouriteSongImage" src="../static/Images/WFS.jpg" alt="FavouriteSong" class="FavouriteSong">
                <button id="FavouriteSongEdit" onclick="replaceWithSearch('FavouriteSong', 'song')">Edit</button>
            </div>
        </div>

        <br><br><br> <!--Replace with actual CSS-->

        <h1>Recent Reviews</h1>
        <table class="RecentReviews">
            <tbody>
                {% for review in reviews %}
                <tr>
                    <td><img src="{{ review.artist_name | replace(' ', '_') }}.jpg" alt="Artist PFP"></td>
                    <td>{{ review.album_name }}</td>
                    <td>{{ review.artist_name }}</td>
                    <td>{{ review.date_listened }}</td>
                    <td>{{ review.review }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <button onclick="addReview()">Add Review</button>
    </div>

</body>
</html>
