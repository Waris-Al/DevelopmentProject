<!DOCTYPE html>
<link href="../static/css/homepage.css" rel="stylesheet" type="text/css" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include "NavBar.html" %} 
<html>
<body>
    <div class="Homepage">
        <h1>My Favourites</h1>
        <iframe id="newReview" src="newReview" class="newReview" style="display:none"></iframe>
        <div class="topThree">
            <div class="FavouriteAlbum"> 
                <p>GUTS</p>
                <img src="https://i.scdn.co/image/ab67616d0000b273e85259a1cae29a8d91f2093d" alt="FavouriteAlbum" class="FavouriteAlbum">
                <button>Edit</button>
            </div>

            <div class="FavouriteArtist">
                <p>Kendrick Lamar</p>
                <img src="../static/Images/WFA.jpg" alt="FavouriteArtist" class="FavouriteArtist">
                <button>Edit</button>
            </div>

            <div class="FavouriteSong">
                <p>Dreams and Nightmares</p>
                <img src="../static/Images/WFS.jpg" alt="FavouriteSong" class="FavouriteSong">
                <button>Edit</button>
            </div>
        </div>

        <br><br><br> <!--Replace with actual CSS-->

        <h1>Recent Reviews</h1>
        <table class="RecentReviews">
            <tbody>
                {% for review in reviews %}
                <tr>
                    <td><img src="{{ review.artist_name | replace(' ', '_') }}.jpg" alt="Artist PFP"></td>
                    <td>{{ review.album_name }}</td>
                    <td>{{ review.artist_name }}</td>
                    <td>{{ review.date_listened }}</td>
                    <td>{{ review.review }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <button onclick="addReview()">Add Review</button>
    </div>



    <script>
       
    
        function addReview() {
            document.getElementById("newReview").style.display = "block"; 
        }    
    

    </script>
    
</body>
</html>
