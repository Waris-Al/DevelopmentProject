<!DOCTYPE html>
<link href="../static/css/DM.css" rel="stylesheet" type="text/css" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include "NavBar.html" %} 
<html>
<head>
    <title>Flask WebSocket Example</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
    <script>

        function loadMessages(){
            fetch('/retrieveMessages')
            .then(response => response.json()) 
            .then(previousMessages => {
                let messageContainer = document.getElementById("previousMessages");
                messageContainer.innerHTML = ""; 

                previousMessages.forEach(msg => {
                    appendMessage(msg.sender, msg.message, msg.timestamp);
                });
            })
            .catch(error => console.error('Error fetching messages:', error));
        }

        function appendMessage(sender, message, timestamp) {
            let messageContainer = document.getElementById("previousMessages");
            messageContainer.innerHTML += `${sender} <br> ${message} <br> ${timestamp} <br><br>`;
        }

        window.onload = function () {
            loadMessages();
        };
        
        var socket;

        function sendMessage() {
            var msg = document.getElementById('message').value;
            var sender = "me"; 

            socket.send(msg);
        
            fetch('/recordMessage', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: msg }) 
            })
            .then(response => response.json())  
            .then(data => console.log('Server Response:', data))
            .catch(error => console.error('Error:', error));

            document.getElementById('message').value = "";
        }

        document.addEventListener('DOMContentLoaded', () => {
            socket = io();

            socket.on('connect', function() {
                console.log('Connected to server');
            });

            socket.on('message', function(msg) {
                console.log('Message received:', msg);
            
                if (msg.sender && msg.message && msg.timestamp) {
                    appendMessage(msg.sender, msg.message, msg.timestamp);
                } else {
                    console.error('Invalid message format:', msg);
                }
            });
            

            socket.on('disconnect', function() {
                console.log('Disconnected from server');
            });
        });

    </script>
</head>
<body>
    <div class="messages">
        <p id="previousMessages"></p>
    </div>

    <div class="messageInput">
        <input type="text" id="message">
        <button onclick="sendMessage()" class="sendMessage">Send</button>
    </div>
</body>
</html>
